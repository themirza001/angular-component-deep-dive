<app-header />
<main>
  <div id="dashboard">


    <app-dashboard-item title="SERVER STATUS" [image]="{
        src: 'status.png',
        alt: 'server status'
    }">
      <app-server-status></app-server-status>
    </app-dashboard-item>


    <app-dashboard-item title="Traffic" [image]="{
        src: 'globe.png',
        alt: 'A globe'}">
      <app-traffic [dummyTrafficData]="dummyTrafficData" [maxTraffic]="maxTraffic"></app-traffic>
    </app-dashboard-item>

    <app-dashboard-item title="Support Tickets" [image]="{
        src: 'list.png',
        alt: 'A list of items'
    }">
      <app-tickets></app-tickets>
    </app-dashboard-item>

  </div>
</main>
